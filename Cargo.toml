[package]
name = "tauri-plugin-sprite-pet"
version = "0.1.0"
authors = ["Yoak3n"]
description = "Tauri plugin for animated sprite pet desktop companions"
license = "MIT"
repository = "https://github.com/Yoak3n/tauri-plugin-sprite-pet"
homepage = "https://github.com/Yoak3n/tauri-plugin-sprite-pet"
keywords = ["tauri", "plugin", "sprite", "pet", "desktop"]
categories = ["gui", "multimedia::images"]
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-sprite-pet"

[dependencies]
tauri = { version = "2.10.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "fs"] }
reqwest = { version = "0.12", features = ["json"] }
image = "0.25"
dirs = "6"
tracing = "0.1"
urlencoding = "2"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
schemars = "0.8"

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
schemars = "0.8"
